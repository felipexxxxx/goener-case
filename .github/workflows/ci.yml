name: Validacao do case
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar dependencias fixadas
        run: python -m pip install -r requirements-lock.txt
      - name: Instalar projeto
        run: python -m pip install -e . --no-deps
      - name: Conferir codigo
        run: python -m ruff check goener executar.py validacao
      - name: Testar regras e arquivos do case
        run: python -m pytest --cov=goener --cov-report=xml --junitxml=test-results.xml -q
      - name: Executar automacao de ponta a ponta
        run: python -m goener --config config.toml --no-cache --output .local/outputs
      - name: Guardar logs e evidencias tecnicas
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validacao-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .local/outputs/*/execucao.log
            .local/outputs/*/execucao.jsonl
            .local/outputs/*/resumo.json
            .local/outputs/*/evidencias.json
            test-results.xml
            coverage.xml
          retention-days: 14
