name: Validacao do case
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar dependencias fixadas
        run: python -m pip install -r requirements-lock.txt
      - name: Instalar projeto
        run: python -m pip install -e . --no-deps
      - name: Conferir codigo
        run: python -m ruff check src tests scripts
      - name: Testar regras e arquivos do case
        run: python -m pytest --cov=goener --cov-report=xml --junitxml=test-results.xml -q
      - name: Executar automacao de ponta a ponta
        run: python -m goener --config config.toml --no-cache
      - name: Guardar resultado e evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-${{ matrix.os }}
          path: |
            outputs/
            test-results.xml
            coverage.xml
          retention-days: 14
