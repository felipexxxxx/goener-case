# Caminhos relativos a este arquivo, não ao diretório do terminal.
input_dir = "extratos"
output_dir = ".local/outputs"
runtime_dir = ".local/runtime"
template = "modelo.xlsx"
# Remova para usar o mês anterior na zona America/Sao_Paulo.
period = "2026-10"
ocr_enabled = true
ocr_min_confidence = 0.90
cache_enabled = true
strict = false
max_file_mb = 25
max_pdf_pages = 20
max_image_pixels = 30000000
retries = 2
stop_file = ".local/runtime/STOP"
ai_mode = "automatico" # aplica retenções e exclusões no consolidado; não altera o extrato original
ai_scope = "excecoes" # excecoes: somente revisar/falhou; todos: conferência adicional de todo o lote
ai_batch_size = 1 # uma solicitação por documento, com cache e failover individuais
ai_provider = "gemini" # gemini ou openai
ai_model = "gemini-3.8-flash" # principal; para OpenAI: gpt-4.1-mini
ai_fallback_models = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"] # ordem explícita; [] desliga failover
ai_document_mode = "completo" # completo: PDF/imagem original; Excel com todas as abas; dados: só extração
ai_thinking_level = "high" # maior esforço de raciocínio nos três modelos; pode consumir mais tokens e tempo
ai_requests_per_minute = 12 # abaixo dos 15 RPM observados no projeto
ai_requests_per_day = 450 # reserva margem dentro dos 500 RPD; não inclui consumo de outros programas
ai_timeout_seconds = 60
ai_max_attempts = 3 # até 3 tentativas por modelo para falhas transitórias; 429 alterna diretamente
ai_batch_timeout_seconds = 300 # novas chamadas param após este orçamento de tempo
# Referência informada pelo responsável; projeção para o lote, não medição de todos os formatos.
manual_minutes_per_file = 8.0 # preenchimento
manual_check_minutes_per_file = 2.0 # conferência dos valores
manual_sample_files = 1
manual_sample_basis = "Amostragem manual informada pelo responsável: 8 minutos para preencher e 2 minutos para conferir os valores de um arquivo."
