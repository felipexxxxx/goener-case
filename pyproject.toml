[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goener-case"
version = "1.0.0"
description = "Consolidação auditável de extratos bancários em PDF, Excel e imagem"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openpyxl==3.1.5", "pdfplumber==0.11.10", "Pillow==13.0.0",
  "rapidocr==3.10.0", "onnxruntime==1.32.0",
]

[project.scripts]
goener = "goener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: arquivos reais do case", "ocr: inferência local de OCR"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
